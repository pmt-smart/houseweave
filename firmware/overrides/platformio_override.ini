; HouseWeave — the default build and our envs.
; Copied to firmware/tasmota/platformio_override.ini before a build. Tasmota's
; own .gitignore leaves that file out, so the source copy is kept here.

[platformio]
; A bare `pio run` builds the Living room US panel image, a product image. The base env below is
; what the others extend, not an image to flash.
default_envs = tasmota32-houseweave-living-room-us

[env:tasmota32-houseweave]
; Our own feature set on Tasmota's ESP32 base, and not env:tasmota32-zbbrdgpro,
; whose block of defines comes after our override and redefines what the override
; cannot reach. The features are in user_config_override.h; what that env gives
; besides them is kept here, so the build keeps its partition and its IDF libraries: the partition table, the IDF
; components it leaves out of the hybrid compile, the libraries it ignores, and
; the CC2652 flasher on the file system. The panel envs below replace the file
; list, and the ZBBridge's autoconf file went with autoconf.
extends                  = env:tasmota32_base
board_build.partitions   = partitions/esp32_partition_app1856k_fs1344k.csv
custom_component_remove  = espressif/esp-dsp
                           espressif/esp_modem
                           espressif/esp32-camera
                           espressif/mdns
lib_ignore               = ${env:tasmota32_base.lib_ignore}
                           Micro-RTSP
                           IRremoteESP8266
                           TasmotaModbus
                           ESP Mail Client
                           JPEGDEC
custom_files_upload      = ${env:tasmota32_base.custom_files_upload}
                           tasmota/berry/zigbee/cc2652_flasher.be
                           tasmota/berry/zigbee/intelhex.be
                           tasmota/berry/zigbee/sonoff_zb_pro_flasher.be
                           tools/fw_SonoffZigbeeBridgePro_cc2652/SonoffZBPro_coord_20220219.hex
; The IDF options of the hybrid compile. Four IDF parts the panel does not use
; are left out, in the form Tasmota's own safeboot envs use
; (platformio_tasmota_env32.ini): Bluetooth, with NimBLE, which depends on it;
; PPP, the modem protocol; IP forwarding with NAPT, which depends on it and
; is only the Wi-Fi range extender's router; and IPv6, which the house's network
; does not use, with the -DUSE_IPV6 of the base env taken out below. The softAP and its
; DHCP server stay: Tasmota's Wi-Fi manager and the safeboot's AP use them.
; This value is also the hash that lets a build reuse the IDF libraries of the
; last one (the platform's builder/frameworks/arduino.py): a change here compiles
; them again, once, about 6 minutes.
;
; The PSRAM test pins are the official tasmota32-zbbrdgpro and tasmota32-nspanel
; envs' own, 5 and 18, which neither board uses. Without them the build fell back
; to the ESP-IDF defaults, 17 and 16, the display's UART pins, which Tasmota
; releases at boot when it finds no PSRAM (the NSPanel has none).
custom_sdkconfig         = '# CONFIG_BT_ENABLED is not set'
                           '# CONFIG_LWIP_PPP_SUPPORT is not set'
                           '# CONFIG_LWIP_IP_FORWARD is not set'
                           '# CONFIG_LWIP_IPV4_NAPT is not set'
                           '# CONFIG_LWIP_IPV6 is not set'
                           '# CONFIG_LWIP_IPV6_AUTOCONFIG is not set'
                           '# CONFIG_LWIP_IP6_FRAG is not set'
                           CONFIG_D0WD_PSRAM_CLK_IO=5
                           CONFIG_D0WD_PSRAM_CS_IO=18
; The framework links with the flags of its release build
; (tools/esp32-arduino-libs/esp32/flags/ld_flags and pioarduino-build.py), which
; the hybrid compile does not regenerate, and they pull the Bluetooth
; controller's high-level interrupt vectors in with -u ld_include_hli_vectors_bt.
; The IDF adds that flag only with Bluetooth on (components/bt/CMakeLists.txt).
; Defining the marker symbol satisfies the -u, and the link gets what a plain IDF
; build without Bluetooth gets: the IDF's default level-4 vector (the interrupt
; watchdog uses level 5), and 4.4 KB of static RAM back.
build_unflags            = ${env:tasmota32_base.build_unflags}
                           -DUSE_IPV6
build_flags              = ${env:tasmota32_base.build_flags}
                           -Wl,--defsym=ld_include_hli_vectors_bt=0
; The link's LTO partitions in parallel: the framework links with a bare -flto,
; which compiles them one at a time (lto_parallel.py). The panel envs below
; inherit this list and add their own script to it. panel_build.py goes first,
; before Tasmota's own solidification, which compiles the copy it stamps;
; safeboot_pin.py puts the house's safeboot where the factory image takes it
; from, and tells the app its hash; and safeboot_check.py goes
; after Tasmota's own, which make the factory image it checks.
extra_scripts            = pre:../overrides/panel_build.py
                           pre:../overrides/safeboot_pin.py
                           ${esp32_defaults.extra_scripts}
                           post:../overrides/lto_parallel.py
                           post:../overrides/safeboot_check.py
; The brain, compiled into the firmware by Tasmota's own
; solidification of external Berry (pio-tools/solidify-from-url.py, a pre: script
; of every ESP32 env): each file's class goes into the flash, and the file system
; keeps only autoexec.be and the project's tables (panel_files.py below). The
; prelude runs first in the build's Berry VM and in nothing else. The same files
; are the simulator's BRAIN_FILES (libs/nspanel-sim/vm/src/panel.ts), and
; libs/nspanel-sim/vm/test/brain.test.mjs holds the two lists to each other.
; panel_build.be is the one taken from elsewhere: the copy panel_build.py stamps
; with this build's commit and time, in generated/, which git ignores.
custom_berry_solidify    = ../overrides/_brain_prelude.be
                           ../overrides/generated/panel_build.be
                           ../../berry/tft_pack.be
                           ../../berry/nextion_driver.be
                           ../../berry/pair_sign.be
                           ../../berry/panel_rules.be
                           ../../berry/zigbee_bridge.be
                           ../../berry/zigbee_pairing.be
                           ../../berry/light.be
                           ../../berry/home.be
                           ../../berry/brain.be
                           ../../berry/panel_runtime.be
                           ../../berry/panel_text.be
                           ../../berry/panel_plan.be
                           ../../berry/panel_store.be
                           ../../berry/panel_draw.be
                           ../../berry/panel_plan_view.be
                           ../../berry/panel_plan_commands.be
                           ../../berry/clock_link.be
                           ../../berry/panel_clock.be
                           ../../berry/panel_thermostat_settings.be
                           ../../berry/panel_thermostat_view.be
                           ../../berry/panel_cover_view.be
                           ../../berry/panel_page_buttons.be
                           ../../berry/node_ota.be
                           ../../berry/node_wireless.be
                           ../../berry/panel_ui.be
                           ../../berry/panel_tap_view.be
                           ../../berry/panel_add_view.be
                           ../../berry/panel_driver_view.be
                           ../../berry/panel_schedule.be
                           ../../berry/panel_calendar_draw.be
                           ../../berry/panel_schedule_view.be
                           ../../berry/panel_zigbee.be
                           ../../berry/panel_thermostat.be
                           ../../berry/panel_cover.be
                           ../../berry/panel_lamp_settings.be
                           ../../berry/panel_alarm.be
                           ../../berry/panel_alarm_draw.be
                           ../../berry/panel_alarm_canvas.be
                           ../../berry/panel_alarm_view.be
                           ../../berry/panel_names.be
                           ../../berry/panel_wifi.be
                           ../../berry/panel_mqtt.be
                           ../../berry/panel_http.be
                           ../../berry/server_link.be
                           ../../berry/mesh_http.be
                           ../../berry/node_settings.be
                           ../../berry/node_backup.be
                           ../../berry/panel_backup.be
                           ../../berry/panel_schedule_mqtt.be
                           ../../berry/panel_web.be
                           ../../berry/panel_route.be
                           ../../berry/mesh_events.be
                           ../../berry/mesh_cmd.be
                           ../../berry/panel_gate.be
                           ../../berry/mesh_beat.be
                           ../../berry/house_list.be
                           ../../berry/house_key.be
                           ../../berry/house_state.be
                           ../../berry/house_devices.be
                           ../../berry/house_link.be
                           ../../berry/house_channel.be
                           ../../berry/house_mesh.be
                           ../../berry/house_commands.be
                           ../../berry/house_mqtt.be
                           ../../berry/house_alarm.be
                           ../../berry/house_server.be
                           ../../berry/panel_remote_view.be
                           ../../berry/panel_house_view.be
                           ../../berry/panel_boot.be

; The lib_extra_dirs inherited through the extends chain did not bring lib/lib_div
; back (`pio run -v` showed 3 of the 9 directories expected): it is declared here
; rather than trusted to the inheritance, or QuickEspNow.h (in
; lib/lib_div/QuickESPNow) is not found although it is on the disk.
lib_extra_dirs            = ${common.lib_extra_dirs}
                          lib/libesp32
                          lib/libesp32_lvgl

; One env per panel: the same firmware, brain compiled in, and the panel's own
; filesystem image in firmware.factory.bin. The panels' firmware takes the
; NSPanel's template on a fresh configuration (HOUSEWEAVE_PANEL_IMAGE, in
; user_config_override.h); the base env does not, for the ZBBridge Pro. `custom_panel_project`
; names the generated project the panel runs, and ../overrides/panel_files.py
; stages autoexec.be (PANEL_PROJECT set to it) and the project's tables
; (<project>.jsonl) into the one directory `custom_files_upload` names.
;
; The list is replaced, not extended: the base env's own files (the CC2652
; flasher and its .hex) never reach a panel.
;
; The build cache (build_cache_dir in platformio.ini) shares part of the work
; between these envs: the first takes about 15 min and the second half of that.
; Each image lands in build_output/firmware/<env>.factory.bin (and <env>.bin
; for OTA); a later env's build may empty an earlier one's .pio/build dir.
;
; The panels' partition table is their own: the app gets 2,176 KB
; and the file system 1,024 KB, which still holds the packed .tft with room to
; grow. A table only changes at a serial flash of the factory image, so an app
; over the old table's 1,856 KB must not reach a panel still on it by OTA: it
; would stay in the safeboot. The bridge keeps the base env's table.
[env:tasmota32-houseweave-living-room-eu]
extends                  = env:tasmota32-houseweave
board_build.partitions   = ../overrides/esp32_partition_app2176k_fs1024k.csv
build_flags              = ${env:tasmota32-houseweave.build_flags}
                           -DHOUSEWEAVE_PANEL_IMAGE
custom_panel_project     = p1-living-room-eu-landscape
custom_files_upload      = .pio/panel_files/living-room-eu
extra_scripts            = ${env:tasmota32-houseweave.extra_scripts}
                           post:../overrides/panel_files.py

[env:tasmota32-houseweave-living-room-us]
extends                  = env:tasmota32-houseweave
board_build.partitions   = ../overrides/esp32_partition_app2176k_fs1024k.csv
build_flags              = ${env:tasmota32-houseweave.build_flags}
                           -DHOUSEWEAVE_PANEL_IMAGE
custom_panel_project     = p1-living-room-us-portrait
custom_files_upload      = .pio/panel_files/living-room-us
extra_scripts            = ${env:tasmota32-houseweave.extra_scripts}
                           post:../overrides/panel_files.py

; The ZBBridge Pro's image: the same firmware with the
; bridge's template (HOUSEWEAVE_BRIDGE_IMAGE, user_config_override.h), and its relay
; compiled in instead of the panel's brain, for the bridge to update by OTA as a
; panel does -- an OTA writes the app, and not the file system. The
; solidify list is the relay's alone: the prelude, the build's stamp (which the house's Info of a node says, house_mesh.be), PairSign, ClockLink, the two drivers, the
; discovery, the host of the devices' drivers, the thermostats' and the blinds' drivers and the relay (berry/test and libs/nspanel-sim/vm/test/brain.test.mjs hold the
; files to the rules). bridge_files.py stages the file system: autoexec.be, which
; is berry/zbbridge_autoexec.be, and Tasmota's CC2652 flasher with the
; coordinator's firmware, which the base env carries as its own files.
[env:tasmota32-houseweave-bridge]
extends                  = env:tasmota32-houseweave
build_flags              = ${env:tasmota32-houseweave.build_flags}
                           -DHOUSEWEAVE_BRIDGE_IMAGE
custom_berry_solidify    = ../overrides/_brain_prelude.be
                           ../overrides/generated/panel_build.be
                           ../../berry/pair_sign.be
                           ../../berry/clock_link.be
                           ../../berry/zbbridge_relay_pairing.be
                           ../../berry/zbbridge_discovery.be
                           ../../berry/zbbridge_drivers.be
                           ../../berry/zbdriver_thermostat.be
                           ../../berry/zbdriver_cover.be
                           ../../berry/zbdriver_twokey.be
                           ../../berry/mesh_beat.be
                           ../../berry/mesh_events.be
                           ../../berry/zbbridge_alarm_merge.be
                           ../../berry/zbbridge_alarm_mesh.be
                           ../../berry/zbbridge_alarm.be
                           ../../berry/mesh_cmd.be
                           ../../berry/house_list.be
                           ../../berry/house_key.be
                           ../../berry/house_state.be
                           ../../berry/house_devices.be
                           ../../berry/house_link.be
                           ../../berry/house_channel.be
                           ../../berry/house_mesh.be
                           ../../berry/house_commands.be
                           ../../berry/house_mqtt.be
                           ../../berry/house_alarm.be
                           ../../berry/panel_wifi.be
                           ../../berry/panel_http.be
                           ../../berry/node_ota.be
                           ../../berry/node_wireless.be
                           ../../berry/server_link.be
                           ../../berry/mesh_http.be
                           ../../berry/node_settings.be
                           ../../berry/node_backup.be
                           ../../berry/bridge_backup.be
                           ../../berry/zbbridge_relay.be
custom_bridge_image      = yes
custom_bridge_extra      = tasmota/berry/zigbee/cc2652_flasher.be
                           tasmota/berry/zigbee/intelhex.be
                           tasmota/berry/zigbee/sonoff_zb_pro_flasher.be
                           tools/fw_SonoffZigbeeBridgePro_cc2652/SonoffZBPro_coord_20220219.hex
custom_files_upload      = .pio/bridge_files
extra_scripts            = ${env:tasmota32-houseweave.extra_scripts}
                           post:../overrides/bridge_files.py

; Our safeboot: Tasmota's own safeboot env, built here with HOUSEWEAVE_SAFEBOOT, which keeps the app's
; features of user_config_override.h out of it. The bootloader runs it to write the app; ours will receive the image over
; the mesh as well as by HTTP, check its signature, and show the panel a page of its own. A proof of concept first:
; what it weighs with what our devices never use left out (Ethernet: no device of ours has one), against the 832 KB of the
; partition, where Tasmota's own safeboot uses 800 432 B. What it leaves out goes by the flags of user_config_override.h
; (HOUSEWEAVE_SAFEBOOT): switching Ethernet off in the framework's sdkconfig also leaves two Ethernet PHY components that do not
; compile without it, and with no code of Tasmota's calling the Ethernet driver the linker drops it anyway.
[env:tasmota32-houseweave-safeboot]
extends                  = env:tasmota32-safeboot
build_flags              = ${env:tasmota32-safeboot.build_flags}
                           -DHOUSEWEAVE_SAFEBOOT
; Tasmota's post_esp32.py copies any safeboot it builds over the file every factory image takes; every panel and bridge build
; puts the house's signed one back there first (safeboot_pin.py), so a build of this one, not signed yet, never
; reaches a factory image: it goes there signed, through firmware/safeboot/ (scripts/ota-release.mjs publish).
; panel_build.py writes the stamp that names the image in releases/ (scripts/build-firmware.ps1): without it the name was
; the last panel or bridge build's; this image compiles no Berry, and the stamp is all it writes
extra_scripts            = pre:../overrides/panel_build.py
                           ${env:tasmota32-safeboot.extra_scripts}

; The off-channel probe's bench images: the Living room US
; panel's and the bridge's images with xdrv_98_2_espnow_mesh_probe.ino in, which
; measures ESP-NOW sent and heard on another channel than the station's
; (esp_now_switch_channel_tx, esp_now_remain_on_channel). Not product images:
; named outside tasmota32-houseweave-*, so a bare build-firmware.ps1 leaves
; them out, and built by name.
[env:tasmota32-probe-living-room-us]
extends                  = env:tasmota32-houseweave-living-room-us
build_flags              = ${env:tasmota32-houseweave-living-room-us.build_flags}
                           -DUSE_ESPNOW_MESH_PROBE

[env:tasmota32-probe-bridge]
extends                  = env:tasmota32-houseweave-bridge
build_flags              = ${env:tasmota32-houseweave-bridge.build_flags}
                           -DUSE_ESPNOW_MESH_PROBE

; Uncomment and set for a first flash over USB (after it, the way is OTA):
; [env]
; upload_port = COM4
; monitor_port = COM4
